<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benvenuto tra i Founding Restaurants | Respiru</title>
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" style="position: relative; top: 0; left: 0; transform: none; width: 100%; max-width: 100%; border-radius: 0; background: rgba(253,248,240,0.92); border: none; box-shadow: 0 2px 8px rgba(23,39,45,0.08); padding: 16px; z-index: 10;">
    <a class="brand" href="/" style="margin-left: 0;">
      <img class="brand-mark" src="logo.svg" alt="Logo Respiru">
      <span>Respiru</span>
    </a>
  </header>

  <main style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 80px); padding: 32px 16px;">
    <section style="max-width: 600px; text-align: center;" id="fcResult">
      <div style="margin-bottom: 48px;">
        <p style="color: var(--peach); font-size: 0.76rem; font-weight: 850; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 16px;" id="fcEyebrow">Verifica in corso</p>
        <h1 style="margin: 0 0 18px; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1; color: var(--blue);" id="fcTitle">Un momento...</h1>
        <p style="margin: 0 0 28px; color: var(--muted); font-size: 1.08rem; line-height: 1.7; max-width: 520px; margin-left: auto; margin-right: auto;" id="fcMessage">Stiamo verificando il tuo pagamento con il nostro provider.</p>
      </div>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a class="button primary" href="/">Torna alla home</a>
        <a class="button secondary" href="/contatti">Hai domande?</a>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      const eyebrow = document.getElementById('fcEyebrow');
      const title = document.getElementById('fcTitle');
      const message = document.getElementById('fcMessage');

      const render = (state) => {
        const states = {
          paid: {
            eyebrow: 'Adesione confermata',
            title: 'Benvenuto tra i Founding Restaurants!',
            message: "La tua adesione a Respiru è stata registrata correttamente. Hai ottenuto le condizioni riservate ai Founder. Ti aggiorneremo sui prossimi sviluppi e sulla data di attivazione.",
          },
          processing: {
            eyebrow: 'Pagamento in elaborazione',
            title: 'Stiamo completando la tua adesione.',
            message: "Il pagamento è stato avviato e il tuo istituto lo sta ancora elaborando. Appena confermato riceverai conferma della tua adesione Founder: non serve ripetere il pagamento.",
          },
          pending: {
            eyebrow: 'Pagamento non completato',
            title: 'Il pagamento risulta ancora aperto.',
            message: "Non abbiamo ricevuto conferma del pagamento. Se hai chiuso la pagina per errore, puoi riprovare dalla sezione Founding Restaurants del sito.",
          },
          expired: {
            eyebrow: 'Sessione scaduta',
            title: 'Il checkout è scaduto.',
            message: "La sessione di pagamento non è più valida. Nessun addebito è stato effettuato: puoi avviare una nuova adesione dalla sezione Founding Restaurants del sito.",
          },
          unknown: {
            eyebrow: 'Verifica non riuscita',
            title: 'Non riusciamo a verificare questo pagamento.',
            message: "Se hai completato un pagamento e vedi questo messaggio, scrivici: verificheremo subito la tua adesione manualmente.",
          },
        };

        const s = states[state] || states.unknown;
        eyebrow.textContent = s.eyebrow;
        title.textContent = s.title;
        message.textContent = s.message;
      };

      if (!sessionId) {
        render('unknown');
        return;
      }

      fetch('/api/checkout-session-status?session_id=' + encodeURIComponent(sessionId))
        .then((r) => r.json())
        .then((data) => render(data.status))
        .catch(() => render('unknown'));
    })();
  </script>
</body>
</html>
